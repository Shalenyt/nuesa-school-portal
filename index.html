<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // One address for the portal: passkeys and sign ins are tied to www.nuesa.org.
      // Browsers keep logins per address, so carry the current login across in the
      // part of the link after # (never sent to any server) and clear it here.
      if (location.hostname === 'nuesa.org') {
        var to = 'https://www.nuesa.org' + location.pathname + location.search;
        try {
          var key = 'sb-nzxvupidbjcfinoztmrd-auth-token';
          var saved = JSON.parse(localStorage.getItem(key) || 'null');
          var rt = saved && (saved.refresh_token || (saved.currentSession && saved.currentSession.refresh_token));
          if (rt) {
            localStorage.removeItem(key);
            to += '#nuesa_handoff=' + encodeURIComponent(rt);
          } else {
            to += location.hash;
          }
        } catch (e) {
          to += location.hash;
        }
        location.replace(to);
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NUESA Portal</title>
    <meta name="description" content="NUESA Portal - Access courses, grades, attendance, voting, and more" />

    <meta property="og:title" content="NUESA Portal" />
    <meta property="og:description" content="NUESA Management Portal" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.nuesa.org/logo.png" />
    <meta property="og:url" content="https://www.nuesa.org/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
